<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title description">
  <title id="title">返现进度界面示意</title>
  <desc id="description">四个年度概览卡片和月度返现表的布局。所有数值都是空白占位符，不包含个人进度。</desc>
  <rect width="1200" height="540" rx="28" fill="#faf6f5"/>
  <rect x="1" y="1" width="1198" height="538" rx="27" fill="none" stroke="#eadfdf" stroke-width="2"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="46" y="61" fill="#342b2d" font-size="29" font-weight="700">返现进度</text>
    <text x="46" y="90" fill="#786e71" font-size="15">按导入结单估算；活动奖赏由使用者自行确认。</text>
    <rect x="970" y="39" width="182" height="34" rx="17" fill="#fff0f2"/>
    <text x="992" y="61" fill="#a5243b" font-size="13">示意图 · 无真实数据</text>

    <rect x="46" y="118" width="264" height="147" rx="18" fill="#fff" stroke="#e9dfe0" stroke-width="2"/>
    <rect x="46" y="118" width="264" height="7" rx="3.5" fill="#bd2941"/>
    <text x="68" y="158" fill="#6d6265" font-size="16">今年常规返现</text>
    <text x="68" y="212" fill="#a91c35" font-size="37" font-weight="700">— <tspan font-size="16" font-weight="400">RC</tspan></text>
    <text x="68" y="243" fill="#988e90" font-size="13">信用卡消费 ＋ 最红自主奖赏</text>

    <rect x="327" y="118" width="264" height="147" rx="18" fill="#fff" stroke="#e9dfe0" stroke-width="2"/>
    <rect x="327" y="118" width="264" height="7" rx="3.5" fill="#bd2941"/>
    <text x="349" y="158" fill="#6d6265" font-size="16">今年活动奖赏</text>
    <text x="349" y="212" fill="#a91c35" font-size="37" font-weight="700">— <tspan font-size="16" font-weight="400">RC</tspan></text>
    <text x="349" y="243" fill="#988e90" font-size="13">仅计手动确认的已获金额</text>

    <rect x="608" y="118" width="264" height="147" rx="18" fill="#fff" stroke="#e9dfe0" stroke-width="2"/>
    <rect x="608" y="118" width="264" height="7" rx="3.5" fill="#bd2941"/>
    <text x="630" y="158" fill="#6d6265" font-size="16">今年合资格消费</text>
    <text x="630" y="212" fill="#a91c35" font-size="37" font-weight="700">— <tspan font-size="16" font-weight="400">CNY</tspan></text>
    <text x="630" y="243" fill="#988e90" font-size="13">按已导入交易的净额</text>

    <rect x="889" y="118" width="265" height="147" rx="18" fill="#fff" stroke="#e9dfe0" stroke-width="2"/>
    <rect x="889" y="118" width="265" height="7" rx="3.5" fill="#bd2941"/>
    <text x="911" y="158" fill="#6d6265" font-size="16">剩余还能拿（上限）</text>
    <text x="911" y="212" fill="#a91c35" font-size="37" font-weight="700">— <tspan font-size="16" font-weight="400">RC</tspan></text>
    <text x="911" y="243" fill="#988e90" font-size="13">有封顶活动的理论剩余</text>

    <rect x="46" y="290" width="1108" height="207" rx="18" fill="#fff" stroke="#e9dfe0" stroke-width="2"/>
    <text x="69" y="331" fill="#342b2d" font-size="20" font-weight="700">每月返现与餐饮消费</text>
    <text x="69" y="357" fill="#8c8285" font-size="13">返现按入账月统计；餐饮消费与门槛按交易月统计。</text>
    <rect x="69" y="378" width="1062" height="39" rx="6" fill="#faf6f5"/>
    <text x="87" y="403" fill="#6d6265" font-size="14">月份</text>
    <text x="295" y="403" fill="#6d6265" font-size="14">信用卡消费 RC</text>
    <text x="524" y="403" fill="#6d6265" font-size="14">最红自主 RC</text>
    <text x="752" y="403" fill="#6d6265" font-size="14">每月合计 RC</text>
    <text x="959" y="403" fill="#6d6265" font-size="14">内地餐饮消费</text>
    <text x="87" y="451" fill="#a89ea0" font-size="15">导入后显示</text>
    <text x="295" y="451" fill="#a89ea0" font-size="15">—</text>
    <text x="524" y="451" fill="#a89ea0" font-size="15">—</text>
    <text x="752" y="451" fill="#a89ea0" font-size="15">—</text>
    <text x="959" y="451" fill="#a89ea0" font-size="15">—</text>
  </g>
</svg>
