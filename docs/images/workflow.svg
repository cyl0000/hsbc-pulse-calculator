<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">汇丰 Pulse 返现计算器的使用流程</title>
  <desc id="description">导入 PDF 结单，在浏览器本地解析，然后查看返现进度和交易记录。图片不含真实数据。</desc>
  <rect width="1200" height="440" rx="28" fill="#faf6f5"/>
  <rect x="1" y="1" width="1198" height="438" rx="27" fill="none" stroke="#eadfdf" stroke-width="2"/>
  <text x="46" y="63" fill="#aa1c35" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" letter-spacing="4">PULSE · 返现账本</text>
  <text x="46" y="108" fill="#342b2d" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">导入结单，核对每一笔返现</text>
  <text x="46" y="139" fill="#776e71" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">所有结单与手动设置都保存在当前浏览器；以下仅为功能示意。</text>

  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="46" y="180" width="326" height="202" rx="20" fill="#fff" stroke="#e9dfe0" stroke-width="2"/>
    <rect x="71" y="204" width="56" height="56" rx="15" fill="#fff0f2"/>
    <path d="M87 215h19l8 8v22H87z M106 215v9h8 M94 234h13 M94 240h13" fill="none" stroke="#b21d36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="147" y="225" fill="#b21d36" font-size="13" font-weight="700">01 / 导入</text>
    <text x="147" y="251" fill="#342b2d" font-size="23" font-weight="700">PDF 电子结单</text>
    <path d="M72 281h274" stroke="#efe9e9" stroke-width="2"/>
    <text x="72" y="315" fill="#665e61" font-size="16">文字版 PDF 在本地解析</text>
    <text x="72" y="346" fill="#8d8487" font-size="14">支持多份导入与刷新后恢复</text>

    <path d="M385 279h27m-9-9 9 9-9 9" fill="none" stroke="#bd8d97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="427" y="180" width="326" height="202" rx="20" fill="#fff" stroke="#e9dfe0" stroke-width="2"/>
    <rect x="452" y="204" width="56" height="56" rx="15" fill="#fff0f2"/>
    <path d="M463 244v-8m10 8v-18m10 18v-12m10 12v-25" fill="none" stroke="#b21d36" stroke-width="4" stroke-linecap="round"/>
    <text x="528" y="225" fill="#b21d36" font-size="13" font-weight="700">02 / 计算</text>
    <text x="528" y="251" fill="#342b2d" font-size="23" font-weight="700">返现进度</text>
    <path d="M453 281h274" stroke="#efe9e9" stroke-width="2"/>
    <text x="453" y="315" fill="#665e61" font-size="16">常规返现与活动奖赏分列</text>
    <text x="453" y="346" fill="#8d8487" font-size="14">按月份查看 RC 与餐饮消费</text>

    <path d="M766 279h27m-9-9 9 9-9 9" fill="none" stroke="#bd8d97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="808" y="180" width="346" height="202" rx="20" fill="#fff" stroke="#e9dfe0" stroke-width="2"/>
    <rect x="833" y="204" width="56" height="56" rx="15" fill="#fff0f2"/>
    <path d="M845 217h31m-31 10h31m-31 10h21m-21 10h25" stroke="#b21d36" stroke-width="2.5" stroke-linecap="round"/>
    <text x="909" y="225" fill="#b21d36" font-size="13" font-weight="700">03 / 核对</text>
    <text x="909" y="251" fill="#342b2d" font-size="23" font-weight="700">交易记录</text>
    <path d="M834 281h294" stroke="#efe9e9" stroke-width="2"/>
    <text x="834" y="315" fill="#665e61" font-size="16">筛选、查看来源及导出</text>
    <text x="834" y="346" fill="#8d8487" font-size="14">退款与支付方式可逐笔核对</text>
  </g>
</svg>
